<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pet Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="adopt.html">Adopt</a>
    </nav>
    <header>
        <h1>The Pet Cafe</h1>
        <p>A Cozy Cafe where every table comes with a cat</p>
    </header>

    <section id="mood">
        <h2>Pick your mood!</h2>
        <select id="mood-select">
            <option value="">-- choose --</option>
            <option value="sleepy">Sleepy</option>
            <option value="playful">Playful</option>
            <option value="hungry">Hungry</option>
        </select>
        <p id="mood-text">We'll greet you once you choose!</p>
    </section>

    <section id="menu">
        <h2>Menu</h2>
        <table>
            <tr><th>Item</th><th>Price</th></tr>
            <tr><td>Latte</td><td>$5</td></tr>
            <tr><td>Croissant</td><td>$4</td></tr>
            <tr><td>Cat Treats</td><td>$2</td></tr>
        </table>
    </section>
    <section id="gallery">
        <img src="cafe.jpg" alt="cafe interior">
        <img src="cat.jpg" alt="A resident cat">
    </section>

    <footer>
        <p>Built with one cup of coffee by Timo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
